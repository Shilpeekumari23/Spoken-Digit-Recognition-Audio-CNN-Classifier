<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240"><rect width="960" height="240" rx="18" fill="#0c192b" stroke="#294057"/><text x="28" y="36" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start">CNN architecture</text><text x="28" y="60" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#9eb7cc" font-weight="400" text-anchor="start">Four feature-extraction blocks followed by a compact classification head</text><rect x="28" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="86" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">32</text><text x="86" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Conv + pool</text><path d="M146 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="158" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="216" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">64</text><text x="216" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Conv + pool</text><path d="M276 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="288" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="346" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">128</text><text x="346" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Conv + pool</text><path d="M406 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="418" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="476" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">256</text><text x="476" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Conv</text><path d="M536 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="548" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="606" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">256</text><text x="606" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Global avg pool</text><path d="M666 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="678" y="91" width="116" height="91" rx="8" fill="#172d43" stroke="#3b5368"/><text x="736" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#f8fafc" font-weight="700" text-anchor="middle">128</text><text x="736" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Dense + ReLU</text><path d="M796 136h10m-4 -4 4 4 -4 4" stroke="#5eead4" fill="none"/><rect x="808" y="91" width="116" height="91" rx="8" fill="#164e55" stroke="#2dd4bf"/><text x="866" y="130" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#99f6e4" font-weight="700" text-anchor="middle">10</text><text x="866" y="156" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#b6c9dc" font-weight="400" text-anchor="middle">Output logits</text><text x="28" y="211" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a9bfd4" font-weight="400" text-anchor="start">3×3 kernels · BatchNorm + ReLU · Dropout 0.5 and 0.3 in the classifier</text></svg>